<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#120b08">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>Cardápio Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="promo"><span id="pt"></span><button onclick="promo.style.display='none'" aria-label="Fechar">✕</button>
    </div>
    <header class="top">
        <div class="brand"><span id="bE" class="logo"></span><span id="bN"></span></div><span id="st" class="st"></span>
    </header>
    <div class="hero"><span class="kick" id="hk">🔥 Cardápio digital</span>
        <h1 id="hN"></h1>
        <div class="tag" id="hT"></div>
        <div class="pills" id="hP"></div>
    </div>
    <nav class="chips" id="chips"></nav>
    <main id="menu"></main>
    <footer>
        <div class="an" id="fN"></div>
        <div class="tag" id="fT"></div>
        <div id="fI"></div>
        <div class="copy" id="fC"></div>
        <div class="lj"><a href="loja.html" id="fL">🖨️ Imprimir pedido · área da loja</a></div>
    </footer>
    <div class="bar" id="bar" onclick="openCart()"></div>
    <div class="toast" id="toast"></div>
    <div class="ov" id="mo" onclick="if(event.target===this)closeM()">
        <div class="sheet" id="sh"></div>
    </div>
    <div class="ov" id="do" onclick="if(event.target===this)closeD()">
        <div class="dr" id="dr"></div>
    </div>
    <div class="ov closed" id="cl">
        <div>
            <div class="an">Estamos fechados</div>
            <p id="clp" style="color:var(--mu)"></p><button class="cta"
                onclick="cl.classList.remove('show')">Entendi</button>
        </div>
    </div>
    <div class="pwa" id="pwa"><span style="flex:1" id="pwt"></span><button id="pwi" class="hide"
            style="font-weight:800;color:var(--o)">Instalar</button><button onclick="pwaX()"
            aria-label="Fechar">✕</button></div>
    <a id="wal" class="hide" target="_blank" rel="noopener"></a>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
